<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#ffffff; font-family:'Patrick Hand','Segoe Print','Comic Sans MS',cursive,sans-serif; color:#222222; }
  .wf-label { font-size:11px; color:#999999; }
  .wf-box { border:1.5px solid #333333; }
  .wf-box-light { border:1px solid #bbbbbb; }
  .wf-chip { border:1px solid #777777; border-radius:999px; padding:6px 14px; font-size:13px; background:#f6f6f6; white-space:nowrap; }
  .wf-chip-active { background:#222222; color:#ffffff; border-color:#222222; }
  .wf-badge { border:1px solid #333333; border-radius:999px; padding:2px 9px; font-size:10px; background:#eeeeee; white-space:nowrap; }
  .wf-ph { background:#eeeeee; border:1px solid #999999; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:6px; color:#999999; font-size:12px; text-align:center; }
</style>
</helmet>
<div style="width:390px;height:844px;background:#ffffff;position:relative;overflow:hidden;">
  <svg style="position:absolute;width:0;height:0" aria-hidden="true">
  <defs>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2" fill="none" stroke="#888888" stroke-width="1.5"/><circle cx="8" cy="10" r="1.8" fill="none" stroke="#888888" stroke-width="1.5"/><path d="M4 17l5-5 3 3 4-5 4 5" fill="none" stroke="#888888" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2" fill="none" stroke="#888888" stroke-width="1.5"/><path d="M10 9l6 3-6 3z" fill="#888888"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="#333333" stroke-width="1.5"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" stroke="#333333" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.6-4.6 4.1 1.3 6-5.4-3.2-5.4 3.2 1.3-6-4.6-4.1 6.1-.6z" fill="none" stroke="#555555" stroke-width="1.4" stroke-linejoin="round"/></symbol>
    <symbol id="i-star-fill" viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.6-4.6 4.1 1.3 6-5.4-3.2-5.4 3.2 1.3-6-4.6-4.1 6.1-.6z" fill="#333333" stroke="#333333" stroke-width="1.4" stroke-linejoin="round"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" fill="none" stroke="#333333" stroke-width="1.5"/><rect x="13" y="3" width="8" height="8" fill="none" stroke="#333333" stroke-width="1.5"/><rect x="3" y="13" width="8" height="8" fill="none" stroke="#333333" stroke-width="1.5"/><rect x="13" y="13" width="8" height="8" fill="none" stroke="#333333" stroke-width="1.5"/></symbol>
    <symbol id="i-tasks" viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9" fill="none" stroke="#333333" stroke-width="1.6" stroke-linecap="round"/><circle cx="20" cy="18" r="2" fill="none" stroke="#333333" stroke-width="1.5"/></symbol>
  </defs>
  </svg>

  <div style="position:absolute;top:0;left:0;right:0;bottom:56px;overflow-y:auto;">
    <div style="display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 16px;border-bottom:2px solid #333333;">
      <span style="font-size:16px;font-weight:bold;">历史画廊</span>
      <svg width="18" height="18"><use href="#i-gear"></use></svg>
    </div>

    <div style="display:flex;gap:8px;padding:14px 16px;overflow-x:auto;">
      <div class="wf-chip wf-chip-active">全部</div>
      <div class="wf-chip">图片</div>
      <div class="wf-chip">视频</div>
      <div class="wf-chip">已收藏</div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 16px 16px;">
      <div class="wf-box-light" style="position:relative;">
        <div class="wf-ph" style="height:150px;"><svg width="22" height="22"><use href="#i-image"></use></svg></div>
        <svg width="15" height="15" style="position:absolute;top:8px;right:8px;"><use href="#i-star-fill"></use></svg>
        <div style="padding:8px;display:flex;justify-content:space-between;align-items:center;"><span class="wf-badge">文生图</span><span style="font-size:10px;color:#888888;">今天</span></div>
      </div>
      <div class="wf-box-light" style="position:relative;">
        <div class="wf-ph" style="height:150px;"><svg width="22" height="22"><use href="#i-video"></use></svg></div>
        <svg width="15" height="15" style="position:absolute;top:8px;right:8px;"><use href="#i-star"></use></svg>
        <div style="padding:8px;display:flex;justify-content:space-between;align-items:center;"><span class="wf-badge">视频生成</span><span style="font-size:10px;color:#888888;">今天</span></div>
      </div>
      <div class="wf-box-light" style="position:relative;">
        <div class="wf-ph" style="height:150px;"><svg width="22" height="22"><use href="#i-image"></use></svg></div>
        <svg width="15" height="15" style="position:absolute;top:8px;right:8px;"><use href="#i-star"></use></svg>
        <div style="padding:8px;display:flex;justify-content:space-between;align-items:center;"><span class="wf-badge">图生图</span><span style="font-size:10px;color:#888888;">昨天</span></div>
      </div>
      <div class="wf-box-light" style="position:relative;">
        <div class="wf-ph" style="height:150px;"><svg width="22" height="22"><use href="#i-image"></use></svg></div>
        <svg width="15" height="15" style="position:absolute;top:8px;right:8px;"><use href="#i-star"></use></svg>
        <div style="padding:8px;display:flex;justify-content:space-between;align-items:center;"><span class="wf-badge">多图合成</span><span style="font-size:10px;color:#888888;">昨天</span></div>
      </div>
      <div class="wf-box-light" style="position:relative;">
        <div class="wf-ph" style="height:150px;"><svg width="22" height="22"><use href="#i-image"></use></svg></div>
        <svg width="15" height="15" style="position:absolute;top:8px;right:8px;"><use href="#i-star"></use></svg>
        <div style="padding:8px;display:flex;justify-content:space-between;align-items:center;"><span class="wf-badge">文生图</span><span style="font-size:10px;color:#888888;">3天前</span></div>
      </div>
      <div class="wf-box-light" style="position:relative;">
        <div class="wf-ph" style="height:150px;"><svg width="22" height="22"><use href="#i-video"></use></svg></div>
        <svg width="15" height="15" style="position:absolute;top:8px;right:8px;"><use href="#i-star"></use></svg>
        <div style="padding:8px;display:flex;justify-content:space-between;align-items:center;"><span class="wf-badge">视频生成</span><span style="font-size:10px;color:#888888;">4天前</span></div>
      </div>
    </div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;height:56px;border-top:2px solid #333333;background:#ffffff;display:flex;align-items:center;justify-content:space-around;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:2px;color:#999999;"><svg width="20" height="20"><use href="#i-image"></use></svg><span style="font-size:10px;">工作台</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:2px;"><svg width="20" height="20"><use href="#i-grid"></use></svg><span style="font-size:10px;font-weight:bold;">画廊</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:2px;color:#999999;"><svg width="20" height="20"><use href="#i-tasks"></use></svg><span style="font-size:10px;">任务</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:2px;color:#999999;"><svg width="20" height="20"><use href="#i-gear"></use></svg><span style="font-size:10px;">设置</span></div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
